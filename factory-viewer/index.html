<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Factory Floor — OpenUSD Demo</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --panel: rgba(20, 23, 30, 0.72);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8ebf0;
    --muted: #8b93a3;
    --accent: #5ab0ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  model-viewer {
    width: 100%;
    height: 100%;
    --poster-color: transparent;
    background: radial-gradient(circle at 50% 35%, #1a1f29 0%, #0b0d12 70%);
  }
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 20px 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    z-index: 10;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  .topbar h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .topbar p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  .badge {
    pointer-events: auto;
    font-size: 11.5px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
  }
  .hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  button#ar-button {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 10;
    background: var(--accent);
    color: #06121f;
    border: none;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 20px;
    cursor: pointer;
  }
  #progress-bar {
    display: block;
    width: 33%;
    max-width: 260px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    overflow: hidden;
  }
  #progress-bar .update-bar {
    background: var(--accent);
    width: 0%;
    height: 100%;
    transition: width 0.2s;
  }
  .slot.poster { background: var(--bg); }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Factory Floor</h1>
    <p>Built in NVIDIA Omniverse · OpenUSD · exported via Blender → glTF</p>
  </div>
  <div class="badge">Karan Grover</div>
</div>

<model-viewer
  src="factory.glb"
  camera-controls
  touch-action="pan-y"
  auto-rotate
  auto-rotate-delay="1500"
  rotation-per-second="8deg"
  shadow-intensity="0.9"
  exposure="1.0"
  environment-image="neutral"
  camera-orbit="35deg 40deg 90%"
  min-camera-orbit="auto 15deg auto"
  max-camera-orbit="auto 85deg auto"
  ar
  ar-modes="webxr scene-viewer quick-look"
>
  <div slot="poster" class="slot poster">
    <div id="progress-bar"><div class="update-bar"></div></div>
  </div>
  <button slot="ar-button" id="ar-button">View in AR</button>
</model-viewer>

<div class="hint"><span class="dot"></span> Drag to orbit · scroll to zoom</div>

<script>
  const mv = document.querySelector('model-viewer');
  const bar = document.querySelector('.update-bar');
  mv.addEventListener('progress', (e) => {
    const p = Math.round(e.detail.totalProgress * 100);
    bar.style.width = p + '%';
  });
</script>

</body>
</html>
