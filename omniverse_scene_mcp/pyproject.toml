[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniverse-scene-mcp"
version = "0.1.0"
description = "Scene-aware Omniverse MCP scaffold"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.13,<2",
]

[project.scripts]
omniverse-scene-mcp = "omniverse_scene_mcp.__main__:main"
omniverse-router-mcp = "omniverse_scene_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
